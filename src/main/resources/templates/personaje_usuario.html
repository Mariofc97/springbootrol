<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Personaje</title>

    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script>
        function toggleMenu() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('open');
        }
    </script>
</head>

<body>

<header class="topbar">
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="iconbtn" onclick="toggleMenu()" type="button">
            <i class="bi bi-list"></i>
        </button>
        <div class="brand" th:text="${personaje.nombre}">Personaje</div>
    </div>

    <div class="who">
        <span>Ficha del personaje</span>
    </div>
</header>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="panel">
            <div class="panel-title">Navegación</div>

            <div class="nav">
                <a th:href="@{/home(pid=${personaje.id})}">
                    <i class="bi bi-arrow-left"></i> Volver al menú
                </a>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">

        <div class="card" style="max-width:600px;">
            <h2 class="h2" th:text="${personaje.nombre}">Personaje</h2>

            <p class="sub" style="margin-top:10px;">
                Información general del personaje
            </p>

            <div style="margin-top:16px; color:var(--muted); display:flex; flex-direction:column; gap:8px;">

                <div>
                    <b style="color:var(--text);">Nivel:</b>
                    <span th:text="${personaje.nivel}"></span>
                </div>

                <div>
                    <b style="color:var(--text);">Puntos de Vida:</b>
                    <span th:text="${personaje.puntosVida}"></span> /
                    <span th:text="${personaje.puntosVidaMax}"></span>
                </div>

            </div>

            <div style="margin-top:20px;">
                <a class="btn2" th:href="@{/home(pid=${personaje.id})}">
