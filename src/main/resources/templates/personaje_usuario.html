<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Personaje</title>

    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script>
        function toggleMenu() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('open');
        }
    </script>
</head>

<body>

<header class="topbar">
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="iconbtn" onclick="toggleMenu()" type="button">
            <i class="bi bi-list"></i>
        </button>
        <div class="brand" th:text="${personaje.nombre}">Personaje</div>
    </div>

    <div class="who">
        <span>Ficha del personaje</span>
    </div>
</header>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="panel">
            <div class="panel-title">Navegación</div>

            <div class="nav">
                <a th:href="@{/home(pid=${personaje.id})}">
                    <i class="bi bi-arrow-left"></i> Volver al menú
                </a>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">

        <div class="card" style="max-width:700px; margin: 0 auto;">

            <!-- Cabecera (icono opcional + nombre + raza) -->
            <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
                <img th:if="${razaIcon != null}" th:src="${razaIcon}" alt="Icono raza"
                     style="width:54px; height:54px; object-fit:contain;
                            filter: drop-shadow(0 0 10px rgba(0,0,0,.35));">

                <div>
                    <h2 class="h2" th:text="${personaje.nombre}" style="margin:0;">Personaje</h2>
                    <div style="color:var(--muted); margin-top:4px;">
                        Raza: <span th:text="${personaje.razaTipo}"></span>
                    </div>
                </div>
            </div>

            <p class="sub" style="margin-top:0;">
                Información general del personaje
            </p>

            <!-- Tabla stats actuales (BD) -->
            <div style="margin-top:14px; border:1px solid var(--border); border-radius:10px; overflow:hidden;">
                <table style="width:100%; border-collapse:collapse; min-width:0;">
                    <thead>
                    <tr style="background: rgba(255,255,255,.04);">
                        <th style="text-align:left; padding:10px; color:var(--muted); font-weight:600;">Atributo</th>
                        <th style="text-align:right; padding:10px; color:var(--muted); font-weight:600; width:140px;">Valor</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td style="padding:10px;">Nivel</td>
                        <td style="padding:10px; text-align:right;" th:text="${personaje.nivel}"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">Experiencia</td>
                        <td style="padding:10px; text-align:right;" th:text="${personaje.experiencia}"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">Episodio actual</td>
                        <td style="padding:10px; text-align:right;" th:text="${personaje.episodioActual}"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">PV</td>
                        <td style="padding:10px; text-align:right;" th:text="${personaje.puntosVida}"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">PV Máx.</td>
                        <td style="padding:10px; text-align:right;" th:text="${personaje.puntosVidaMax}"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">Ataque</td>
                        <td style="padding:10px; text-align:right;" th:text="${personaje.puntosAtaque}"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">Inteligencia</td>
                        <td style="padding:10px; text-align:right;" th:text="${personaje.inteligencia}"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">Suerte</td>
                        <td style="padding:10px; text-align:right;" th:text="${personaje.suerte}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Botones -->
            <div class="actions" style="margin-top:20px;">
                <a class="btn2" th:href="@{/home(pid=${personaje.id})}">
                    <i class="bi bi-arrow-left"></i> Volver al menú
                </a>

                <a class="btn" th:href="@{/episodio/actual/{id}(id=${personaje.id})}">
                    <i class="bi bi-play-circle"></i> Continuar
                </a>
            </div>

        </div>

    </main>

</div>

</body>
</html>
