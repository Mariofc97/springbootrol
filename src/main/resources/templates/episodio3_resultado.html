<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado Episodio 3</title>

    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script>
        function toggleMenu() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('open');
        }
    </script>
</head>

<body>

<header class="topbar">
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="iconbtn" onclick="toggleMenu()" type="button">
            <i class="bi bi-list"></i>
        </button>
        <div class="brand">Episodio 3 completado</div>
    </div>

    <div class="who">
        <span>Resumen del episodio</span>
    </div>
</header>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="panel">
            <div class="panel-title">Navegación</div>

            <div class="nav">
                <a th:href="@{/home(pid=${personaje.id})}">
                    <i class="bi bi-house-door"></i> Menú principal
                </a>
                <a th:href="@{/personaje_usuario/{id}(id=${personaje.id})}">
                    <i class="bi bi-file-earmark-text"></i> Ver personaje
                </a>
                <a th:href="@{/episodio/actual/{id}(id=${personaje.id})}">
                    <i class="bi bi-play-circle"></i> Continuar
                </a>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">

        <div class="card" style="max-width:900px;">

            <h2 class="h2">Episodio 3 completado</h2>
            <p class="sub">Acciones realizadas durante el episodio</p>

            <div style="
                white-space: pre-line;
                background: rgba(255,255,255,.05);
                color: var(--text);
                padding: 16px;
                border-radius: 12px;
                border: 1px solid var(--border);
                margin-top: 16px;
            ">
                <span th:text="${acciones}"></span>
            </div>

            <!-- Botones -->
            <div class="actions" style="margin-top:20px;">

                <a class="btn2" th:href="@{/home(pid=${personaje.id})}">
                    <i class="bi bi-house-door"></i> Menú principal
                </a>

                <a class="btn2" th:href="@{/personaje_usuario/{id}(id=${personaje.id})}">
                    <i class="bi bi-file-earmark-text"></i> Ver personaje
                </a>

                <a class="btn" th:href="@{/episodio/actual/{id}(id=${personaje.id})}">
                    <i class="bi bi-play-circle"></i> Continuar
                </a>

            </div>

        </div>

    </main>

</div>

</body>
</html>
