<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Registro</title>

<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script>
	function toggleMenu() {
		const sb = document.getElementById('sidebar');
		sb.classList.toggle('open');
	}
</script>
</head>

<body>

	<header class="topbar">
		<div style="display: flex; gap: 10px; align-items: center;">
			<button class="iconbtn" onclick="toggleMenu()" type="button">
				<i class="bi bi-list"></i>
			</button>
			<div class="brand">Registro</div>
		</div>

		<div class="who">
			<span>Bienvenido</span>
		</div>
	</header>

	<div class="layout">

		<!-- Sidebar vacía (opcional) -->
		<aside class="sidebar" id="sidebar">
			<div class="panel">
				<div class="panel-title">Navegación</div>
				<div class="nav">
					<a th:href="@{/}"> <i class="bi bi-arrow-left"></i> Volver
					</a>
				</div>
			</div>
		</aside>

		<main class="main">

			<div class="card" style="max-width: 600px;">

				<h2 class="h2">Crear cuenta</h2>
				<p class="sub">Completa los datos para registrarte</p>

				<p th:if="${error}" th:text="${error}"
					style="color: #ff6b6b; margin-top: 10px;"></p>

				<form th:action="@{/registro}" method="post"
					style="margin-top: 16px; display: flex; flex-direction: column; gap: 14px;">

					<div>
						<label style="display: block; margin-bottom: 6px;">Usuario</label>
						<input name="username" required
							style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255, 255, 255, .05); color: var(--text);">
					</div>

					<div>
						<label style="display: block; margin-bottom: 6px;">Email</label> <input
							name="email" type="email" required
							style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255, 255, 255, .05); color: var(--text);">
					</div>

					<div>
						<label style="display: block; margin-bottom: 6px;">Contraseña</label>
						<input name="password" type="password" required
							style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255, 255, 255, .05); color: var(--text);">
					</div>

					<div>
						<label style="display: block; margin-bottom: 6px;">Rol
							(JUGADOR / ADMINISTRADOR)</label> <input name="rol" required
							style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255, 255, 255, .05); color: var(--text);">
					</div>

					<button type="submit" class="btn" style="margin-top: 10px;">
						<i class="bi bi-person-plus"></i> Crear cuenta
					</button>
				</form>

				<div style="margin-top: 16px;">
					<a class="btn2" th:href="@{/}"> <i
						class="bi bi-arrow-left-circle"></i> Volver
					</a>
				</div>

			</div>

		</main>

	</div>

</body>
</html>
