<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Escudos</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script>
	function toggleMenu() {
		document.getElementById('sidebar').classList.toggle('open');
	}
</script>
</head>

<body>

	<header class="topbar">
		<div style="display: flex; gap: 10px; align-items: center;">
			<button class="iconbtn" onclick="toggleMenu()" type="button">
				<i class="bi bi-list"></i>
			</button>

			<div class="brand">
				<i class="bi bi-shield"></i> Escudos
			</div>
		</div>

		<div class="who">
			<span>Personaje: <b
				th:text="${personaje != null ? personaje.nombre : '—'}">—</b></span> <span
				class="badge" sec:authentication="principal.authorities">ROL</span>
		</div>
	</header>

	<div class="layout">

		<aside class="sidebar" id="sidebar">
			<div class="panel">
				<div style="font-weight: 700; margin-bottom: 8px;">Navegación</div>
				<div class="nav" th:if="${pid != null}">
					<a th:href="@{/home(pid=${pid})}"> <i class="bi bi-house-door"></i>
						Menú principal
					</a> <a th:href="@{/home/criaturas(pid=${pid})}"> <i
						class="bi bi-bug"></i> Criaturas
					</a> <a th:href="@{/home/objetos(pid=${pid})}"> <i
						class="bi bi-backpack"></i> Objetos
					</a> <a th:href="@{/home/armas(pid=${pid})}"> <i
						class="bi bi-crosshair"></i> Armas
					</a> <a th:href="@{/home/escudos(pid=${pid})}"> <i
						class="bi bi-shield"></i> Escudos
					</a>
				</div>
			</div>
		</aside>

		<main class="main">
			<div class="card">

				<h2 style="margin: 0;">Lista de escudos</h2>
				<p style="margin: 8px 0 0; color: var(--muted);">Equipamiento de
					tipo escudo.</p>

				<p th:if="${#lists.isEmpty(escudos)}"
					style="margin-top: 12px; color: var(--muted);">No hay escudos.
				</p>

				<div class="tablewrap" th:if="${!#lists.isEmpty(escudos)}">
					<table>
						<thead>
							<tr>
								<th>Nombre</th>
								<th>Peso</th>
								<th>Durabilidad</th>
								<th>Nivel req.</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="s : ${escudos}">
								<td th:text="${s.nombre}">-</td>
								<td th:text="${s.peso}">-</td>
								<td th:text="${s.durabilidad}">-</td>
								<td th:text="${s.nivelRequerido}">-</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="actions">
					<a class="btn2" th:href="@{/home(pid=${pid})}">← Volver al menú</a>
				</div>

			</div>
		</main>

	</div>
</body>
</html>
