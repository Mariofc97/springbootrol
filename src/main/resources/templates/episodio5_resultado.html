<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Historia finalizada</title>

  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    function toggleMenu() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('open');
    }
  </script>
</head>

<body>

<header class="topbar">
  <div style="display:flex; gap:10px; align-items:center;">
    <button class="iconbtn" onclick="toggleMenu()" type="button">
      <i class="bi bi-list"></i>
    </button>
    <div class="brand">Historia finalizada</div>
  </div>

  <div class="who">
    <span th:text="${personaje != null ? personaje.nombre : 'Personaje'}">Personaje</span>
  </div>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="panel">
      <div class="panel-title">Navegación</div>

      <div class="nav">
        <a th:href="@{/home(pid=${pid})}">
          <i class="bi bi-house-door"></i> Menú principal
        </a>

        <a th:if="${personaje != null}" th:href="@{/personaje_usuario/{id}(id=${personaje.id})}">
          <i class="bi bi-file-earmark-text"></i> Ver personaje
        </a>

        <a th:href="@{/personajes}">
          <i class="bi bi-arrow-left-circle"></i> Volver a personajes
        </a>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="card" style="max-width: 900px;">

      <h2 class="h2">
        <i class="bi bi-trophy"></i>
        ¡Enhorabuena! Has completado la historia
      </h2>

      <p class="sub" style="margin-top:10px;">
        Este personaje ha llegado al final del Episodio 5. Ya no se puede reiniciar la historia con él.
      </p>

      <!-- Opcional: mostrar el log del episodio 5 si lo pasas en el model -->
      <div th:if="${acciones != null}" style="
          white-space: pre-line;
          background: rgba(255,255,255,.05);
          color: var(--text);
          padding: 16px;
          border-radius: 12px;
          border: 1px solid var(--border);
          margin-top: 16px;">
        <div class="panel-title" style="margin-bottom:10px;">Resumen final</div>
        <span th:text="${acciones}"></span>
      </div>

      <div class="actions" style="margin-top: 20px;">
        <a class="btn" th:href="@{/home(pid=${pid})}">
          <i class="bi bi-house-door"></i> Menú principal
        </a>

        <a class="btn2" th:href="@{/personajes}">
          <i class="bi bi-arrow-left-circle"></i> Volver a personajes
        </a>
      </div>

    </div>
  </main>

</div>

</body>
</html>
