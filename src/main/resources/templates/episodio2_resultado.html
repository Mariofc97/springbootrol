<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Resultado Episodio 2</title>
</head>

<body>

<h1>Episodio 2 completado</h1>

<h2>Acciones realizadas</h2>

<div style="white-space: pre-line; background:#222; color:#eee; padding:15px; border-radius:8px;">
  <span th:text="${acciones}"></span>
</div>

<br>

<!-- BOTONES / ENLACES -->
<div style="display:flex; gap:12px; margin-top:12px;">

  <!-- Menú principal -->
  <a th:href="@{/home(uid=${uid},pid=${personaje.id})}"
     style="padding:10px 14px; background:#444; color:white; border-radius:8px; text-decoration:none;">
    Menú principal
  </a>

  <!-- Ver personaje -->
  <a th:href="@{/personaje_usuario/{id}(id=${personaje.id})}"
     style="padding:10px 14px; background:#2b6cb0; color:white; border-radius:8px; text-decoration:none;">
    Ver personaje
  </a>

  <!-- Continuar al episodio actual -->
  <a th:href="@{/episodio/actual/{id}(id=${personaje.id})}"
     style="padding:10px 14px; background:#2f855a; color:white; border-radius:8px; text-decoration:none;">
    Continuar
  </a>

</div>

</body>
</html>
